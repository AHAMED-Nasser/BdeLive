name: CI/CD Pipeline

# Trigger workflow on push and pull request
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - uses: shivammathur/setup-php@v2
        with:
<<<<<<< HEAD
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, curl

      # 3️⃣ Install Composer dependencies
      - run: composer install --no-progress --prefer-dist --optimize-autoloader

      # 4️⃣ Run PHPStan
      - run: composer phpstan

  phpcs:
    name: PHPCS Code Style
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, curl

      # 3️⃣ Install Composer dependencies
      - run: composer install --no-progress --prefer-dist --optimize-autoloader

      # 4️⃣ Run PHPCS (only fail on errors, not warnings)
      - run: vendor/bin/phpcs --standard=PSR12 app --error-severity=1 --warning-severity=0

  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bdelive_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_HOST: '127.0.0.1'
      DB_NAME: 'bdelive_test'
      DB_USER: 'root'
      DB_PASSWORD: 'root'
      DB_CHARSET: 'utf8mb4'

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, curl

      # 3️⃣ Install MySQL client
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      # 4️⃣ Install Composer dependencies
      - run: composer install --no-progress --prefer-dist --optimize-autoloader

      # 5️⃣ Wait for MySQL service
      - name: Wait for MySQL service
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -uroot -proot -e 'SELECT 1' && break
            echo "Waiting for MySQL..."
            sleep 1
          done

      # 6️⃣ Run PHPUnit tests
      - run: composer test
