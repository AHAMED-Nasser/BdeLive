name: Vérification PHP (8.4)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Vérifier le code PHP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🧰 Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: 🔍 Vérifier la syntaxe PHP
        run: |
          echo "Vérification de la syntaxe PHP..."
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: 🧹 Vérifier le style avec PHP CodeSniffer (PSR-12)
        run: |
          echo "Installation de PHP CodeSniffer..."
          composer global require "squizlabs/php_codesniffer=*"
          export PATH="$PATH:$(composer global config bin-dir --absolute)"
          echo "Analyse du code avec la norme PSR-12..."
          phpcs --standard=PSR12 --extensions=php app
