name: Deploy Documentation
on:
  push:
    branches: [ main, DEV ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, xsl

      - name: Generate Doc
        run: |
          curl -LO https://phpdoc.org/phpDocumentor.phar
          php phpDocumentor.phar -d ./app -t ./public_doc

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public_doc
          branch: gh-pages
